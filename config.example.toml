# LLM-RIO configuration example
#
# Copy this file to config.toml and change machine_id plus any host paths.
# Built-in behavior is intentionally permissive for research use. TOML has no
# null value, so optional restrictions are shown commented out: uncomment one
# only when the deployment should impose that policy.

# Explicit residency mode: "queue", "vllm-sleep", or "kv-cached".
# Omit to preserve legacy engines.kvcached_mode / prism_weight_cache_mode behavior
# (the built-in default is vllm-sleep). Explicit mode takes precedence over those flags.
# Queue mode fully unloads workers, disables sleep, and loads only for queued requests.
# Also selectable with --mode queue or LLMRIO_SERVING_MODE=queue, without editing TOML.
# serving_mode = "queue"

# Human-readable name used in inventory fingerprints, logs, and diagnostics.
machine_id = "CHANGE_ME"

# API listen address. Keep loopback for a host-local service; use "0.0.0.0"
# only when authenticated researchers must connect over a trusted network.
api_host = "127.0.0.1"

# Public API TCP port.
api_port = 8000

# SQLite state database path.
database_path = "./state/llm-rio.db"

# Root for downloaded, revision-pinned model artifacts.
model_store = "./models"

# Directory for service, validation, and optional worker-engine logs.
log_dir = "./logs"

# Managed GPU UUID allowlist. [] automatically honors CUDA_VISIBLE_DEVICES,
# or manages every NVML GPU when CUDA_VISIBLE_DEVICES is unset.
managed_gpu_uuids = []

# Global per-GPU VRAM reserve for the driver/runtime. Validation rejects a measured
# incremental worker peak above physical-minus-reserve, and the scheduler subtracts
# this value exactly once while composing active peaks and sleeping residuals.
reserved_vram_mib = 2048

# Maximum queued requests for one model. Omitted by default (unbounded).
# queue_capacity_per_model = 1024

# Maximum queued requests from one quota account to one model. Omitted by
# default (unbounded); DRR fairness still applies without a capacity cap.
# queue_capacity_per_tenant = 128

# Seconds an idle READY worker remains resident before automatic unloading.
# This keep-alive never delays queued demand: an idle worker is reclaimed
# immediately when another model needs its GPU.
wait_duration_seconds = 3600

# Prevent a newly READY worker from being replaced for this many seconds.
# The permissive default is 0; uncomment to enable anti-thrashing residency.
# minimum_residency_seconds = 300

# Starvation safety bound for incompatible continuously backlogged models.
fair_share_seconds = 7200

# In experimental kvcached mode, required inference-idle time before validation.
# Normal mode always waits for MAINTENANCE_READY, regardless of this value.
validation_idle_window_seconds = 0

# Nicknames to warm at startup when Prism is active. This is only the initial
# policy: every subsequently requested model is eligible for the RAM weight cache.
# Use ["*"] to warm every AVAILABLE model sequentially.
# Repeat a nickname to warm multiple distinct placements, such as one TP=1 copy per GPU.
prism_preload_models = []

# "ram" keeps idle vLLM workers and their weights in host memory using level-1
# sleep. "disabled" terminates an idle worker instead of retaining a warm process.
# In normal mode, sleeping processes are fully evicted in LRU order when their
# remaining GPU contexts prevent a measured placement from fitting live free VRAM.
# Maintenance fully unloads all production workers before normal-mode validation.
prism_weight_cache_mode = "ram"

# Seconds without real demand before READY weights are proactively copied to
# host RAM. Queued incompatible demand can trigger the same offload immediately.
prism_idle_sleep_seconds = 45

# Maximum simultaneously GPU-resident engines per GPU in kvcached required mode.
# Native mode always permits only one GPU-resident engine per GPU.
prism_max_workers_per_gpu = 2

# Maximum PSS-accounted memory used by warm worker process groups. Omit for an
# automatic ceiling based on effective host/cgroup RAM minus the reserve below.
# prism_host_cache_max_gib = 300

# Preserve at least this much effective host/cgroup RAM for the OS and other work.
prism_host_cache_min_available_gib = 4

# Evict sleeping workers when their measured process-group swap exceeds this value.
# Swap must already be configured by the OS; it is a pressure ceiling, not
# guaranteed cache capacity. Set above zero only when swap-backed latency is acceptable.
prism_swap_max_used_gib = 0

# Deprecated compatibility setting. Incremental-v2 RAM-cache profiles must contain
# a measured sleeping residual; the scheduler refuses profiles where it is missing.
prism_sleep_gpu_reserve_mib = 1536

# HTTP deadline for a vLLM level-1 sleep or wake transition.
prism_transition_timeout_seconds = 180

# Worker health polling deadline. Omitted by default, so unusually slow model
# loads remain allowed while process exit and maintenance still interrupt them.
# worker_startup_timeout_seconds = 900

# Maximum DRAINING duration before forced termination. Omitted by default, so a
# healthy long generation is never killed solely because of elapsed time.
# worker_drain_watchdog_seconds = 600

# Maximum total duration for a non-stream request and for receiving initial
# stream headers. Omitted by default; uncomment to fail an unresponsive worker.
# worker_request_timeout_seconds = 1800

# Maximum silent interval between worker stream chunks. Omitted by default;
# uncomment to reclaim an admitted stream that no longer makes progress.
# worker_stream_idle_timeout_seconds = 600

# Inclusive private TCP port range allocated to inference workers.
worker_port_start = 18000
worker_port_end = 18999

# Maximum scheduler reconciliation interval in seconds.
scheduler_tick_seconds = 1

# Global prompt-token ceiling. Omitted by default; validated model context wins.
# max_prompt_tokens = 32768

# Global generated-token ceiling. Omitted by default; client/model limits win.
# max_output_tokens = 8192

# Global maximum number of returned choices. Omitted by default.
# max_n = 4

# When false, quota settlement charges actual use and refunds unused reservation.
# Set true only to charge the complete requested maximum.
quota_charge_requested_maximum = false

# Capture raw inference-engine stdout/stderr while workers run. The log is kept
# only if a worker fails; cleanly stopped workers discard it.
capture_worker_engine_logs = true

# Application log verbosity: DEBUG, INFO, WARNING, or ERROR.
log_level = "ERROR"

# Hugging Face credential. Prefer LLMRIO_HF_TOKEN in a protected .env file;
# do not store hf_token in this TOML example.

[engines]

# vLLM executable name or absolute path.
vllm_executable = "vllm"

# llama.cpp server executable name or absolute path.
llama_cpp_executable = "llama-server"

# Permit an administrator to manually select llama.cpp/GGUF for a placement
# profile. This never creates an automatic vLLM-to-llama.cpp fallback.
enable_llama_cpp = false

# Per-worker vLLM GPU allocation fraction. Omitted by default so LLM-RIO derives it
# from reserved_vram_mib and detected VRAM. This affects engine allocation only;
# the scheduler uses measured incremental peaks rather than applying it again.
# vllm-sleep validation caps this at 0.80. Queue mode honors this value without
# that cap; omitted values use (physical VRAM - reserved_vram_mib) / physical VRAM.
# Queue OOM retries reduce the fraction by 0.02, up to five retries.
# The successfully measured fraction is persisted for serving. Prism is unchanged.
# gpu_memory_utilization = 0.95

# Engine context-window ceiling. Omitted by default; the model maximum is used.
# max_model_len = 32768

# Engine concurrent-sequence ceiling. Omitted by default.
# max_num_seqs = 128

# Engine batched-token ceiling. Omitted by default.
# max_num_batched_tokens = 8192

# Backend selection. "none" (or an empty value) uses native vLLM level-1
# sleep/wake and one GPU-resident engine per GPU. "required" enables kvcached
# multi-worker co-residency and refuses startup if the package set is unavailable.
# Models are eligible only after the exact backend/configuration has compatible
# incremental-v2 measurements from real validation on this machine.
kvcached_mode = "none"

[engines.environment]

# Extra environment variables inherited by validation and resident workers.
# Example:
# NCCL_NET_PLUGIN = "none"
# VLLM_FLASHINFER_AUTOTUNE_SKIP_OPS = "fp4_gemm"
