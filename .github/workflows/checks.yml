name: release-checks
on: [push, pull_request]
jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check src tests scripts/check_docs.py scripts/qualify.py
      - run: uv run --no-sync ruff format --check src tests scripts/check_docs.py scripts/qualify.py
      - run: uv run --no-sync mypy src/llm_rio
      - run: uv run --no-sync python scripts/check_docs.py
      - run: uv build
      - name: Install native wheel without experimental dependency
        run: |
          uv venv /tmp/rio-package
          uv pip install --python /tmp/rio-package/bin/python dist/*.whl
          cd /tmp
          /tmp/rio-package/bin/python -m llm_rio --help
          /tmp/rio-package/bin/python -c "import importlib.util; assert importlib.util.find_spec('kvcached') is None"
